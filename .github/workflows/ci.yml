name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/test_macd.py inspects the commit that added macd.py
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - name: API contract is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code frontend/openapi.json
      - run: npm --prefix frontend ci
      - name: TypeScript types match the API contract
        run: |
          npm --prefix frontend run gen:api
          git diff --exit-code frontend/src/lib/api-schema.ts
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - name: Browser checks (gates 1 and 3)
        run: |
          npm install -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium
          NODE_PATH="$(npm root -g)" node --test e2e/*.test.cjs
