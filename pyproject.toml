[project]
name = "moneylab"
version = "0.1.0"
description = "Local, single-user trading research lab for US stocks and ETFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "streamlit>=1.50",
    "plotly>=5.23",
    "exchange-calendars>=4.5",
    "typer>=0.12",
    "httpx>=0.28.1",
]

[project.scripts]
moneylab = "moneylab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "acceptance: end-to-end checks for the six MVP acceptance gates",
    "slow: long-running tests such as the capacity benchmark",
    "network: tests that call a live data provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moneylab"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "plotly.*", "streamlit.*", "pyarrow.*"]
ignore_missing_imports = true
